<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Bay — an open-world crime game. Steal cars, lose the police, run missions for Lena and Marco, and hunt 12 gold coins around the city. Hold Space or the mouse button to keep firing.">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="data:,">
<title>Solmar Bay — Open World Crime</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  /* Crosshair over the game: the mouse aims the gun on foot. */
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { color: #eef1f5; font: 16px system-ui, sans-serif; text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Drive, steal cars, run missions, lose the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p>Solmar Bay needs JavaScript to run.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
